name: prep_suzy

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      - redis